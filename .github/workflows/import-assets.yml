name: Import site images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-assets.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download site-assets --repo "$GITHUB_REPOSITORY" --pattern '*.jpg' --dir assets --clobber
          cat > /tmp/sums.txt <<'SUMS'
          5c0793f84b4d28dc6f3ed34ce9b21face8c90c38bc5883bc5fcac0066cf33440  assets/bathroom-detail.jpg
          f6f838eacf887a99b01732d6375429181820ddca064c217fc46f36d954b65741  assets/bathroom.jpg
          978db42158d78bf954cc88cf1e4c571cc6022719efe1c906f056d26ecbd84d13  assets/driveway.jpg
          276cb13e0fe44a61024cd2e7dc7f14840e7a8c670358e8ac12e51c11830dd499  assets/electrics.jpg
          011255e18e71931f48fd7a15b01e2dfbad5ded1c4d8d66959edb055f0df007a9  assets/house-detail.jpg
          69e5ba735ad13343dc4428d209158b818876f52ddd51cc4993aaef7430d5eba5  assets/house.jpg
          3455b64558fa82a3de65910505ee0d1be0f9ab36e7283909452e51bbe277f5ba  assets/kitchen-detail.jpg
          2f196458b99cf5a7385f2a1e10da43e25c685fa67de2213c3377442f94e947b0  assets/kitchen.jpg
          1bad960fd3984b10614f9f82b75cbd1ff307518e91b360df4d3b869e5f8d7d02  assets/lion-logo.jpg
          a2c7a0b49a01bf70cacb2c9a5420ac79a3e710fdcb534eeb015bf73a2f732aa2  assets/painting.jpg
          SUMS
          sed -i 's/^ *//' /tmp/sums.txt
          sha256sum -c /tmp/sums.txt
          ls -l assets
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Import optimised site images from release"
          git push
